<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>さんきゅうやきとり</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2c1810, #4a2c1a);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
            width: 100vw;
            margin: 0;
            padding: 0;
            touch-action: none; /* スマホでのスクロールを防ぐ */
        }

        .game-title {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffa500;
            font-size: clamp(24px, 8vw, 48px);
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            font-weight: bold;
            z-index: 100;
            white-space: pre-line;
            text-align: center;
            line-height: 1.2;
        }

        .score-board {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            font-size: clamp(16px, 4vw, 24px);
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .customer {
            position: absolute;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(40px, 12vw, 80px);
            z-index: 50;
            transition: all 0.3s ease;
        }

        .speech-bubble {
            position: absolute;
            top: 220px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: clamp(20px, 6vw, 32px);
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 60;
            white-space: nowrap;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
        }

        .speech-bubble.good {
            color: #4caf50;
        }

        .speech-bubble.bad {
            color: #f44336;
        }

        .grill-area {
            position: absolute;
            bottom: 80px;
            left: 5px;
            right: 5px;
            height: clamp(150px, 25vh, 200px);
            background: linear-gradient(to top, #ff6b35, #d84315);
            border-radius: 15px 15px 0 0;
            box-shadow: 0 -10px 30px rgba(255, 107, 53, 0.5);
            overflow: hidden;
        }

        .yakitori {
            position: absolute;
            bottom: 15px;
            width: clamp(60px, 12vw, 80px);
            height: clamp(140px, 20vh, 180px);
            cursor: grab;
            transition: transform 0.1s ease;
            user-select: none;
        }

        .yakitori:active {
            cursor: grabbing;
        }

        .yakitori.dragging {
            z-index: 1000;
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .yakitori.flying {
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .stick {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 120px;
            background: linear-gradient(to top, #d4af37, #b8860b);
            border-radius: 3px;
        }

        /* 串の具（共通） */
        .piece {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.3);
            transition: background 0.3s ease;
        }
        .p-tsukune  { width: 45px; height: 30px; border-radius: 50%; }
        .p-meat     { width: 42px; height: 24px; border-radius: 10px; }
        .p-negi     { width: 34px; height: 16px; border-radius: 8px; }
        .p-reba     { width: 44px; height: 26px; border-radius: 45% 60% 40% 55%; }
        .p-momo     { width: 46px; height: 28px; border-radius: 9px 14px 8px 12px; }
        .p-tebasaki { width: 54px; height: 95px; border-radius: 45% 45% 30% 60% / 30% 30% 60% 60%; }

        /* 焼き加減のステージ：つくね */
        .rare .p-tsukune    { background: linear-gradient(135deg, #ffb3ba, #ff7b7b); }
        .medium .p-tsukune  { background: linear-gradient(135deg, #deb887, #cd853f); }
        .perfect .p-tsukune { background: linear-gradient(135deg, #cd853f, #a0522d); }

        /* ねぎま：鶏肉 */
        .rare .p-meat    { background: linear-gradient(135deg, #ffd6c9, #f7a99a); }
        .medium .p-meat  { background: linear-gradient(135deg, #f0d2a8, #d9a066); }
        .perfect .p-meat { background: linear-gradient(135deg, #d9a066, #b5651d); }
        /* ねぎま：ねぎ */
        .rare .p-negi    { background: linear-gradient(135deg, #e6f5c9, #9ccc65); }
        .medium .p-negi  { background: linear-gradient(135deg, #c5e1a5, #7cb342); }
        .perfect .p-negi { background: linear-gradient(135deg, #aed581, #6b8e23); }
        .burnt .p-negi   { background: linear-gradient(135deg, #4e5b31, #2e3b1f) !important; }

        /* レバー */
        .rare .p-reba    { background: linear-gradient(135deg, #c2404f, #7a1f2b); }
        .medium .p-reba  { background: linear-gradient(135deg, #9a4a40, #6d2a2a); }
        .perfect .p-reba { background: linear-gradient(135deg, #7a4430, #4a2518); }

        /* 手羽先 */
        .rare .p-tebasaki    { background: linear-gradient(135deg, #ffe0cc, #f5b7a0); }
        .medium .p-tebasaki  { background: linear-gradient(135deg, #f2c98a, #d99a4e); }
        .perfect .p-tebasaki { background: linear-gradient(135deg, #f0b44c, #a8621a); }

        /* もも */
        .rare .p-momo    { background: linear-gradient(135deg, #ffc9c0, #f49b8e); }
        .medium .p-momo  { background: linear-gradient(135deg, #f3d3a3, #d8a160); }
        .perfect .p-momo { background: linear-gradient(135deg, #d4914a, #9c5a25); }

        /* 焦げ（共通） */
        .burnt .piece { background: linear-gradient(135deg, #5d4037, #3e2723); }

        .yakitori-label {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 8px;
            white-space: nowrap;
            pointer-events: none;
        }

        .instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffa500;
            font-size: clamp(12px, 3vw, 18px);
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            padding: 0 10px;
            line-height: 1.3;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            font-size: clamp(18px, 4vw, 24px);
            display: none;
            z-index: 200;
            max-width: 90vw;
            box-sizing: border-box;
        }

        .restart-btn {
            background: #ffa500;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: clamp(16px, 4vw, 20px);
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s ease;
            touch-action: manipulation; /* タッチ操作の最適化 */
        }

        .restart-btn:hover {
            background: #ff8c00;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .start-title {
            color: #ffa500;
            font-size: clamp(32px, 12vw, 64px);
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
            line-height: 1.2;
        }

        .start-btn {
            background: #ffa500;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: clamp(20px, 6vw, 32px);
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 165, 0, 0.3);
            touch-action: manipulation; /* タッチ操作の最適化 */
        }

        .start-btn:hover {
            background: #ff8c00;
            transform: translateY(-2px);
        }

        .progress-bar {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4caf50, #8bc34a, #ff9800, #f44336);
            transition: width 0.1s linear;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .customer.happy {
            animation: bounce 0.5s ease-in-out;
        }

        .customer.angry {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-5deg); }
            75% { transform: translateX(-50%) rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <div class="start-title">さんきゅう<br>やきとり</div>
        <button class="start-btn" onclick="startGameWithSound()">スタート</button>
    </div>

    <div class="game-title">さんきゅう<br>やきとり</div>
    
    <div class="score-board">
        <div>スコア: <span id="score">0</span></div>
        <div>ミス: <span id="misses">0</span></div>
    </div>

    <div class="customer" id="customer">👨‍🍳</div>
    <div class="speech-bubble" id="speech"></div>

    <div class="grill-area" id="grill"></div>

    <div class="instructions">
        🔥 串をちょうどいい焼き加減で上にフリック！ 🔥<br>
        焼き時間：レバー（短）→ねぎま→もも→つくね→手羽先（長）
    </div>

    <div class="game-over" id="gameOver">
        <h2>ゲームオーバー！</h2>
        <p>最終スコア: <span id="finalScore">0</span></p>
        <button class="restart-btn" id="restartBtn">もう一度プレイ</button>
    </div>

    <script>
        // 音声ファイルの管理
        class SoundManager {
            constructor() {
                this.sounds = {
                    bgm: new Audio('yaki.mp3'),
                    start: new Audio('start.mp3'),
                    flick: new Audio('omachi.mp3'),
                    ok: new Audio('39.mp3'),
                    ng: new Audio('kora.mp3'),
                    gameover: new Audio('gong.mp3')
                };
                
                // BGMをループ設定
                this.sounds.bgm.loop = true;
                this.sounds.bgm.volume = 0.3;
                
                // その他の音量調整
                this.sounds.start.volume = 0.7;
                this.sounds.flick.volume = 0.5;
                this.sounds.ok.volume = 0.8;
                this.sounds.ng.volume = 0.8;
                this.sounds.gameover.volume = 0.9;
                
                // 音声ファイルが見つからない場合のエラーハンドリング
                Object.keys(this.sounds).forEach(key => {
                    this.sounds[key].addEventListener('error', (e) => {
                        console.warn(`音声ファイル ${key}.mp3 が見つかりません`);
                    });
                });
            }
            
            play(soundName) {
                try {
                    if (this.sounds[soundName]) {
                        this.sounds[soundName].currentTime = 0;
                        this.sounds[soundName].play().catch(e => {
                            console.warn(`音声再生エラー: ${soundName}`, e);
                        });
                    }
                } catch (e) {
                    console.warn(`音声再生エラー: ${soundName}`, e);
                }
            }
            
            playBGM() {
                try {
                    this.sounds.bgm.currentTime = 0;
                    return this.sounds.bgm.play().catch(e => {
                        console.warn('BGM再生エラー:', e);
                    });
                } catch (e) {
                    console.warn('BGM再生エラー:', e);
                }
            }
            
            stopBGM() {
                this.sounds.bgm.pause();
                this.sounds.bgm.currentTime = 0;
            }
            
            stopAll() {
                Object.values(this.sounds).forEach(sound => {
                    sound.pause();
                    sound.currentTime = 0;
                });
            }
        }

        // 串の種類：cookTime = 完璧になるまでの時間(ms)、points = 得点
        const SKEWER_TYPES = {
            reba:     { name: 'レバー', cookTime: 2000, points: 15,
                        pieces: [['reba',18],['reba',48],['reba',78],['reba',108]] },
            negima:   { name: 'ねぎま', cookTime: 3000, points: 10,
                        pieces: [['meat',18],['negi',46],['meat',66],['negi',94],['meat',114]] },
            momo:     { name: 'もも',   cookTime: 3500, points: 10,
                        pieces: [['momo',18],['momo',50],['momo',82],['momo',114]] },
            tsukune:  { name: 'つくね', cookTime: 4000, points: 15,
                        pieces: [['tsukune',20],['tsukune',45],['tsukune',70],['tsukune',95],['tsukune',120]] },
            tebasaki: { name: '手羽先', cookTime: 5000, points: 20,
                        pieces: [['tebasaki',20]] }
        };
        const SKEWER_KEYS = Object.keys(SKEWER_TYPES);

        class YakitoriGame {
            constructor() {
                this.score = 0;
                this.misses = 0;
                this.maxMisses = 5;
                this.yakitoris = [];
                this.nextYakitoriTime = 0;
                this.speedFactor = 1.0; // 焼き時間の倍率（スコアに応じて短くなる）
                this.spawnInterval = 2000; // 2秒ごとに新しい焼き鳥
                this.gameRunning = true;
                
                this.grill = document.getElementById('grill');
                this.customer = document.getElementById('customer');
                this.speech = document.getElementById('speech');
                
                // サウンドマネージャーを初期化
                this.soundManager = new SoundManager();
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.gameLoop();
                this.spawnYakitori();
                
                // BGMは自動開始しない（ブラウザポリシーのため）
            }

            setupEventListeners() {
                let isDragging = false;
                let startY = 0;
                let startX = 0;
                let currentYakitori = null;

                this.grill.addEventListener('mousedown', (e) => this.handleStart(e, e.clientX, e.clientY));
                this.grill.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.handleStart(e, touch.clientX, touch.clientY);
                });

                document.addEventListener('mousemove', (e) => this.handleMove(e, e.clientX, e.clientY));
                document.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.handleMove(e, touch.clientX, touch.clientY);
                });

                document.addEventListener('mouseup', (e) => this.handleEnd(e));
                document.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.handleEnd(e);
                });
            }

            handleStart(e, clientX, clientY) {
                const yakitori = e.target.closest('.yakitori');
                if (yakitori && !yakitori.classList.contains('flying')) {
                    this.isDragging = true;
                    this.startY = clientY;
                    this.startX = clientX;
                    this.currentYakitori = yakitori;
                    yakitori.classList.add('dragging');
                }
            }

            handleMove(e, clientX, clientY) {
                if (this.isDragging && this.currentYakitori) {
                    const deltaY = this.startY - clientY;
                    const deltaX = clientX - this.startX;
                    
                    if (deltaY > 0) {
                        this.currentYakitori.style.transform = `translateY(-${deltaY}px) translateX(${deltaX}px)`;
                    }
                }
            }

            handleEnd(e) {
                if (this.isDragging && this.currentYakitori) {
                    const deltaY = this.startY - (e.clientY || e.changedTouches[0].clientY);
                    
                    if (deltaY > 50) { // フリック判定
                        this.soundManager.play('flick'); // フリック音を再生
                        this.serveYakitori(this.currentYakitori);
                    } else {
                        // 元の位置に戻す
                        this.currentYakitori.style.transform = '';
                    }
                    
                    this.currentYakitori.classList.remove('dragging');
                    this.currentYakitori = null;
                    this.isDragging = false;
                }
            }

            spawnYakitori() {
                if (!this.gameRunning) return;

                const yakitori = document.createElement('div');
                const typeKey = SKEWER_KEYS[Math.floor(Math.random() * SKEWER_KEYS.length)];
                const type = SKEWER_TYPES[typeKey];
                yakitori.className = `yakitori type-${typeKey} rare`;
                
                // スマホ対応：画面幅に応じた位置調整
                const screenWidth = window.innerWidth;
                const yakitoriWidth = Math.min(80, screenWidth * 0.12); // 画面幅の12%、最大80px
                const maxLeft = screenWidth - yakitoriWidth - 20; // 右端から20px余裕
                const leftPosition = Math.random() * Math.max(maxLeft - 20, 20) + 10; // 左端から10px余裕
                
                yakitori.style.left = `${leftPosition}px`;
                
                const piecesHtml = type.pieces
                    .map(([kind, top]) => `<div class="piece p-${kind}" style="top:${top}px"></div>`)
                    .join('');
                yakitori.innerHTML = `
                    <div class="stick"></div>
                    ${piecesHtml}
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="yakitori-label">${type.name}</div>
                `;

                const yakitoriData = {
                    element: yakitori,
                    typeKey: typeKey,
                    cookTime: 0,
                    targetTime: type.cookTime * this.speedFactor,
                    stage: 'rare'
                };

                this.yakitoris.push(yakitoriData);
                this.grill.appendChild(yakitori);

                // 次の焼き鳥をスケジュール
                setTimeout(() => this.spawnYakitori(), this.spawnInterval);
            }

            updateYakitoris() {
                // 削除しても添字がずれないよう後ろから処理
                for (let index = this.yakitoris.length - 1; index >= 0; index--) {
                    const yakitori = this.yakitoris[index];
                    if (yakitori.element.classList.contains('flying')) continue;

                    yakitori.cookTime += 16; // 60FPSで16ms

                    const progress = yakitori.cookTime / yakitori.targetTime;
                    const progressFill = yakitori.element.querySelector('.progress-fill');
                    progressFill.style.width = `${Math.min(progress * 100, 100)}%`;

                    let newStage;
                    if (progress < 0.3) {
                        newStage = 'rare';
                    } else if (progress < 0.7) {
                        newStage = 'medium';
                    } else if (progress < 1.0) {
                        newStage = 'perfect';
                    } else {
                        newStage = 'burnt';
                    }

                    if (newStage !== yakitori.stage) {
                        yakitori.element.classList.remove(yakitori.stage);
                        yakitori.element.classList.add(newStage);
                        yakitori.stage = newStage;
                    }

                    // 焦げすぎたら自動的に失敗
                    if (progress > 1.5) {
                        this.removeYakitori(index);
                        this.addMiss();
                    }
                }
            }

            serveYakitori(yakitoriElement) {
                const yakitoriData = this.yakitoris.find(y => y.element === yakitoriElement);
                if (!yakitoriData) return;

                yakitoriElement.classList.add('flying');
                yakitoriElement.style.transform = 'translateY(-500px)';
                yakitoriElement.style.opacity = '0';

                const stage = yakitoriData.stage;
                const type = SKEWER_TYPES[yakitoriData.typeKey];
                if (stage === 'perfect') {
                    this.addScore(type.points);
                    this.showReaction(`さんきゅう！ ${type.name} +${type.points}`, 'good', true);
                } else {
                    this.addMiss();
                    const reason = stage === 'burnt' ? '焦げてる！' : '生焼け！';
                    this.showReaction(`こらー！ ${type.name}${reason}`, 'bad', false);
                }

                setTimeout(() => {
                    const index = this.yakitoris.findIndex(y => y.element === yakitoriElement);
                    this.removeYakitori(index);
                }, 800);
            }

            showReaction(text, type, isHappy) {
                this.speech.textContent = text;
                this.speech.className = `speech-bubble ${type}`;
                this.speech.style.opacity = '1';

                this.customer.className = isHappy ? 'customer happy' : 'customer angry';
                
                // 効果音を再生
                if (isHappy) {
                    this.soundManager.play('ok');
                } else {
                    this.soundManager.play('ng');
                }

                setTimeout(() => {
                    this.speech.style.opacity = '0';
                    this.customer.className = 'customer';
                }, 1500);
            }

            addScore(points) {
                const prevLevel = Math.floor(this.score / 50);
                this.score += points;
                document.getElementById('score').textContent = this.score;
                
                // 50点ごとにスピードアップ
                if (Math.floor(this.score / 50) > prevLevel) {
                    this.speedFactor = Math.max(this.speedFactor - 0.07, 0.4);
                    this.spawnInterval = Math.max(this.spawnInterval - 100, 800);
                }
            }

            addMiss() {
                this.misses++;
                document.getElementById('misses').textContent = this.misses;
                
                if (this.misses >= this.maxMisses) {
                    this.gameOver();
                }
            }

            removeYakitori(index) {
                if (index >= 0 && index < this.yakitoris.length) {
                    const yakitori = this.yakitoris[index];
                    if (yakitori.element.parentNode) {
                        yakitori.element.parentNode.removeChild(yakitori.element);
                    }
                    this.yakitoris.splice(index, 1);
                }
            }

            gameOver() {
                this.gameRunning = false;
                this.soundManager.stopBGM(); // BGMを停止
                this.soundManager.play('gameover'); // ゲームオーバー音を再生
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOver').style.display = 'block';
            }

            gameLoop() {
                if (this.gameRunning) {
                    this.updateYakitoris();
                    requestAnimationFrame(() => this.gameLoop());
                }
            }
        }

        let game;

        function startGameWithSound() {
            // スタート音を再生
            const soundManager = new SoundManager();
            soundManager.play('start');
            
            // スタート画面を非表示
            document.getElementById('startScreen').style.display = 'none';
            
            // ゲーム開始
            setTimeout(() => {
                game = new YakitoriGame();
                // ユーザー操作後なのでBGMを安全に開始
                game.soundManager.playBGM();
            }, 500); // スタート音の後にゲーム開始
        }

        function startGame() {
            game = new YakitoriGame();
        }

        function restartGame() {
            // 前のゲームの音を停止
            if (game && game.soundManager) {
                game.soundManager.stopAll();
            }
            
            // ゲームをリセット
            document.getElementById('score').textContent = '0';
            document.getElementById('misses').textContent = '0';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('grill').innerHTML = '';
            
            // 新しいゲームを開始してBGMを再生
            game = new YakitoriGame();
            game.soundManager.playBGM();
        }

        // リスタートボタンのイベントリスナーを設定
        document.addEventListener('DOMContentLoaded', function() {
            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) {
                restartBtn.addEventListener('click', restartGame);
                restartBtn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    restartGame();
                });
            }
        });
    </script>
</body>
</html>
